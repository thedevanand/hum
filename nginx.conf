server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml audio/wav audio/x-wav;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy same-origin;

  # app code: always revalidate (no build step, so no hashed names)
  location ~* \.(html|js|css|json)$ { add_header Cache-Control "no-cache"; }
  # big static assets: cache hard
  location ~* ^/(sounds|fonts)/ { add_header Cache-Control "public, max-age=2592000, immutable"; }
}
